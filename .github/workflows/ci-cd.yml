# CI/CD Pipeline for Real-Time Collaborative Whiteboard Frontend
# This pipeline automates the build, lint, security scanning, and deployment
# of the React frontend application to AWS S3 for static website hosting.
# CI stages run on every push and pull request.
# CD stages run only on push to main branch for deployment to AWS S3.

name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # CONTINUOUS INTEGRATION (CI) - Runs on all pushes and PRs
  # ============================================================

  ci-build-and-lint:
    name: CI - Build, Lint and Security Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code from repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 runtime environment
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install project dependencies using clean install
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Step 4: Run ESLint static code analysis for code quality
      - name: Run ESLint Analysis
        run: npm run lint
        continue-on-error: true

      # Step 5: Build production bundle to verify compilation
      - name: Build Production Bundle
        run: npm run build

      # Step 6: Run npm audit for dependency security vulnerabilities
      - name: Run npm Audit Security Scan
        run: npm audit --audit-level=moderate || true

      # Step 7: Run Semgrep security vulnerability scanning
      - name: Run Semgrep Security Scan
        run: |
          pip install semgrep
          semgrep --config p/javascript --config p/react --config p/security-audit --config p/owasp-top-ten --json --output semgrep-results.json . || true
        continue-on-error: true

      # Step 8: Upload build output as artifact for deployment
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 30

      # Step 9: Upload ESLint report as artifact
      - name: Save ESLint Report
        if: always()
        run: npx eslint src/ --format json --output-file eslint-report.json || true

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30

  # ============================================================
  # CONTINUOUS DEPLOYMENT (CD) - Runs only on push to main
  # ============================================================

  cd-deploy:
    name: CD - Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: ci-build-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Checkout source code for deployment
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 for building
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies and build for production
      # VITE_API_URL and VITE_WS_URL are set so the React app calls the
      # production backend instead of localhost during the build
      - name: Install and Build
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}:8080/api
          VITE_WS_URL: http://${{ secrets.EC2_HOST }}:8080/ws
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # Step 4: Configure AWS credentials for S3 deployment
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # Step 5: Deploy frontend build to S3 bucket with static website hosting
      - name: Deploy to S3
        run: |
          # Sync all files to S3 bucket
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
          # Fix MIME types - S3 sometimes serves JS/CSS as binary/octet-stream
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/ s3://${{ secrets.S3_BUCKET_NAME }}/ --recursive --exclude "*" --include "*.js" --content-type "application/javascript" --metadata-directive REPLACE --cache-control "max-age=31536000"
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/ s3://${{ secrets.S3_BUCKET_NAME }}/ --recursive --exclude "*" --include "*.css" --content-type "text/css" --metadata-directive REPLACE --cache-control "max-age=31536000"
          # Configure S3 website hosting with index.html as error document
          aws s3 website s3://${{ secrets.S3_BUCKET_NAME }} --index-document index.html --error-document index.html

      # Step 6: Smoke test - verify the backend health endpoint is reachable
      - name: Smoke Test - Health Check
        continue-on-error: true
        run: |
          # Retry health check up to 3 times with 10s intervals
          for i in 1 2 3; do
            if curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health; then
              echo "Backend health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Backend health check failed after 3 attempts - app may still be starting or waiting for database"
          exit 1
